[project]
name = "market-jepa"
version = "0.1.0"
description = "Leakage-safe multi-timeframe Market-JEPA V0 experiment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyyaml>=6,<7",
    "torch>=2.2,<3",
    "wandb>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.uv]
package = false
